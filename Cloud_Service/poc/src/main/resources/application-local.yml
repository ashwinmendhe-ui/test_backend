server:
  port: 6789

spring:
  application:
    name: dhive

  datasource:
    url: jdbc:postgresql://localhost:5432/dhive-main
    username: postgres
    password: Ashwin@11
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
    
  redis:
    device-alive-second: 84600

logging:
  level:
    org.springframework.security: INFO
    # com.dji.sample: DEBUG
    com.dji.sample: INFO
    org.hibernate.SQL: OFF


app:
