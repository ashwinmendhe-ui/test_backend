    mission-dir: uploads/missions

cors:
  allowed-origin-patterns: "http://localhost:5173,http://127.0.0.1:5173"
  allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600

